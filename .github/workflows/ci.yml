# Runs on GitHub's servers after every push: the backend tests and the
# frontend build. A red cross on a commit means one of them broke.
name: CI

on: push

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # WeasyPrint (the PDF report) needs the Pango library from the system.
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Publishes the public demo to Hugging Face Spaces, but only from main and
  # only after both jobs above have passed. It is skipped until the owner has
  # set the HF_SPACE variable and the HF_TOKEN secret in the repo's settings.
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true # only the newest version matters
    steps:
      - uses: actions/checkout@v4
      - name: Push the app to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          # The Space gets a single fresh commit holding only what the Docker
          # build needs. Hugging Face refuses images and other binary files
          # in a plain git push, and the screenshots in docs/ and in the
          # history are exactly that.
          mkdir space
          git archive HEAD Dockerfile .dockerignore backend frontend | tar -x -C space
          cp deploy/huggingface-space.md space/README.md
          # Forced on for the public site whatever else is set: demo mode,
          # the port the Space card names, and permission for huggingface.co
          # (and no other site) to show the app inside its page.
          printf '\nENV SENTINEL_DEMO=1 PORT=7860 SENTINEL_FRAME_ANCESTORS=https://huggingface.co\n' >> space/Dockerfile
          cd space
          git init -q -b main
          git add -A
          git -c user.name="GitHub Actions" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          # GitHub hides the token in this job's log.
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
