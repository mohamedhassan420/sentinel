# Start the whole app with: docker compose up
# Then open http://localhost:8000
services:
  sentinel:
    build: .
    ports:
      # 127.0.0.1 means only this computer can reach the app,
      # not other devices on the same network.
      - "127.0.0.1:8000:8000"
    volumes:
      # Keeps the database when the container is stopped or rebuilt.
      - sentinel-data:/data
    # Settings such as the Claude API key come from a file named ".env" (see
    # .env.example). The file is optional: without it the app runs in demo
    # mode. The key is handed to the running app only; it is not in the image.
    env_file:
      - path: .env
        required: false

volumes:
  sentinel-data:
